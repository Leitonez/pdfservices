<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · PDF Services</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1120">
  <!-- Absolute paths: this page may be served for any missing URL. -->
  <link rel="icon" type="image/png" href="/assets/img/logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <div class="auth-page grid-bg">
    <header class="auth-header">
      <a class="brand" href="/" aria-label="PDF Services, da CODECYCLE">
        <img src="/assets/img/logo-code.png" alt="" width="84" height="26">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-product">PDF <span>Services</span></span>
      </a>
    </header>
    <main class="auth-main">
      <div class="auth-card card not-found">
        <div class="code not-found-terminal" aria-hidden="true">
          <div class="code-header"><span class="code-dots"><i></i><i></i><i></i></span><span>pdfservices</span><span></span></div>
          <pre><span class="c">$</span> GET <span class="s">"<span id="missing-path">/pagina</span>"</span>
<span class="k">404</span> <span class="p">not_found</span></pre>
        </div>
        <p class="eyebrow">Erro 404</p>
        <h1>Página não encontrada</h1>
        <p class="muted">O endereço pode ter sido digitado errado ou a página mudou de lugar.</p>
        <div class="btn-row">
          <a class="btn btn-primary" href="/">Ir para o painel</a>
          <a class="btn btn-ghost" href="/login/">Entrar</a>
        </div>
      </div>
    </main>
    <footer class="app-footer">
      <p>PDF Services é software livre (AGPL v3) — <a href="https://github.com/Leitonez/pdfservices" target="_blank" rel="noopener">código-fonte</a></p>
      <nav class="app-footer-links" aria-label="Documentos legais">
        <a href="https://pdfservices.sistema.site/termos/">Termos de Uso</a>
        <a href="https://pdfservices.sistema.site/privacidade/">Privacidade</a>
        <a href="https://codecycle.com.br" target="_blank" rel="noopener">© CODECYCLE</a>
      </nav>
    </footer>
  </div>
  <script>
    document.getElementById('missing-path').textContent = window.location.pathname;
  </script>
</body>
</html>
